<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f3">
    <title>DM確率計算</title>
    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>DM確率計算</h1>

      <div class="errors" id="errors" role="alert" hidden>
        <ul id="error-list"></ul>
      </div>

      <form class="calculator" id="calculator" novalidate>
        <label class="field">
          <span>モード</span>
          <select name="mode" id="mode">
            <option value="draw">ドロー計算</option>
            <option value="shield">シールドトリガー確率計算</option>
            <option value="boldugi">ボルドギ成功確率</option>
          </select>
        </label>

        <label class="field">
          <span>デッキ枚数</span>
          <div class="input-wrap">
            <input type="number" name="deck_size" min="1" max="60" value="40" required>
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="draw">
          <span>狙いのカード</span>
          <div class="input-wrap">
            <input type="number" name="target_count" min="0" max="60" value="4">
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="draw">
          <span>先攻・後攻</span>
          <select name="position">
            <option value="first">先攻</option>
            <option value="second">後攻</option>
          </select>
        </label>

        <label class="field mode-field" data-mode="draw">
          <span>現在ターン</span>
          <div class="input-wrap">
            <input type="number" name="current_turn" min="1" value="1">
            <small>ターン目</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="shield" hidden>
          <span>対象のシールドトリガー</span>
          <div class="input-wrap">
            <input type="number" name="trigger_count" min="0" max="40" value="8">
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="shield" hidden>
          <span>シールド</span>
          <div class="input-wrap">
            <input type="number" name="shield_count" min="0" max="10" value="5">
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>自分のデッキのクリーチャー</span>
          <div class="input-wrap">
            <input type="number" name="creature_count" min="12" max="60" value="24">
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>非公開領域（シールド・封印など）</span>
          <div class="input-wrap">
            <input type="number" name="private_count" min="0" max="60" value="11">
            <small>枚</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>コッコ公開済み</span>
          <div class="input-wrap">
            <input type="number" name="cocco_public_count" min="0" max="4" value="0">
            <small>枚 / 4枚中</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>ゴールデン公開済み</span>
          <div class="input-wrap">
            <input type="number" name="golden_public_count" min="0" max="4" value="0">
            <small>枚 / 4枚中</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>コマンドクリーチャー</span>
          <div class="input-wrap">
            <input type="number" name="command_count" min="8" max="60" value="12">
            <small>枚（ゴールデン・モルネク含む）</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>コマンド公開済み</span>
          <div class="input-wrap">
            <input type="number" name="command_public_count" min="0" max="60" value="0">
            <small>枚（ゴールデン・モルネク含む）</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>禁断の残り封印</span>
          <div class="input-wrap">
            <input type="number" name="forbidden_seals" min="0" max="6" value="6">
            <small>個</small>
          </div>
        </label>

        <label class="field mode-field" data-mode="boldugi" hidden>
          <span>モルネク公開済み</span>
          <div class="input-wrap">
            <input type="number" name="morneku_public_count" min="0" max="4" value="0">
            <small>枚 / 4枚中</small>
          </div>
        </label>

        <p class="mode-note mode-field" data-mode="boldugi" hidden>
          デッキ枚数と種類別枚数は、非公開領域と公開済みカードを差し引く前の数です。公開済みカードは山札に残っていない枚数を入力してください。非公開領域のカード種類は不明として計算し、非クリーチャーは呪文として扱います。
        </p>

        <button type="submit">計算する</button>
      </form>

      <section class="result" id="result" aria-live="polite" hidden></section>
      <footer class="disclaimer">
        本サイトは『デュエル・マスターズ』の非公式ファン制作ツールであり、タカラトミーおよびWizards of the Coastとは関係ありません。作品名・ロゴ・カード等に関する権利は各権利者に帰属します。
      </footer>
    </main>
  </body>
</html>
